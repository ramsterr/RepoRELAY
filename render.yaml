services:
  - type: web
    name: reporelay-mvp-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_API
        value: "openai"
      - key: PORT
        value: "8000"
